<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>YORIMICHI QUEST（サンプル）</title>
    <!--
      ?v= は前段キャッシュ対策。実行環境の前段は拡張子で Cache-Control を上書きするため、
      CSS と JS には no-cache が効かない（max-age=14400 になる）。URL を変える以外に手段がない。
      __ASSET_VERSION__ は配信時にコミットハッシュへ置換される。
    -->
    <link rel="stylesheet" href="app.css?v=__ASSET_VERSION__" />
    <link rel="stylesheet" href="styles.css?v=__ASSET_VERSION__" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%E2%9B%A9%3C/text%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript>このサンプルは JavaScript を有効にしてご利用ください。</noscript>
    <script src="app.js?v=__ASSET_VERSION__"></script>
  </body>
</html>
