<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>YORIMICHI QUEST — 実地図デモ</title>
<style>
  :root{
    /* 明るい昼トーン。変数名は据え置き、値だけ差し替え */
    --ink:#2c3242;            /* 文字：濃紺グレー（旧・夜の底） */
    --lantern:#d98a1f;        /* アクセント：陽だまりの橙金 */
    --lantern-dim:#a5660f;
    --flood:#2f8fd4; --alert:#d8503f;
    --paper:#2c3242;          /* ← 既定テキスト色として使われるので濃色に */
    --paper-dim:#6e7688;      /* サブ文字 */
    --panel:rgba(255,255,255,.92);  /* パネルは白の半透明 */
    --mincho:"Hiragino Mincho ProN","Yu Mincho",YuMincho,"Noto Serif JP","Songti SC",serif;
    --gothic:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP","Helvetica Neue",sans-serif;
    --mono:"SFMono-Regular",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#dfe6ee;color:var(--ink);font-family:var(--gothic);overscroll-behavior:none}
  body{display:flex;align-items:center;justify-content:center}
  #phone{position:relative;width:min(390px,100vw);height:min(780px,100dvh);background:#eef2f7;overflow:hidden;
    box-shadow:0 30px 90px rgba(60,80,110,.35),0 0 0 1px rgba(217,138,31,.22)}
  @media(min-width:820px) and (min-height:820px){
    #phone{border-radius:26px;box-shadow:0 30px 90px rgba(60,80,110,.35),0 0 0 8px #e6e0d2,0 0 0 9px rgba(217,138,31,.35)}
  }
  #stage{position:absolute;inset:0;overflow:hidden}

  /* --- 実地図 --- */
  #map{position:absolute;inset:0}
  #map canvas{position:absolute;inset:0;width:100%;height:100%}
  #realmap{position:absolute;inset:0;display:none;filter:saturate(1.06) brightness(1.04)}
  .maplibregl-ctrl-attrib{font-size:8px!important;background:rgba(255,255,255,.7)!important}
  .maplibregl-ctrl-attrib a{color:#556!important}
  #overlay{position:absolute;inset:0;pointer-events:none;image-rendering:pixelated;z-index:5}

  /* HD-2D風グレーディング（ティルトシフト＆ビネット） */
  #grade{position:absolute;inset:0;pointer-events:none;z-index:6}
  #grade .band{position:absolute;left:0;right:0;height:24%;backdrop-filter:blur(2px)}
  #grade .band.top{top:0;-webkit-mask:linear-gradient(#000,transparent);mask:linear-gradient(#000,transparent)}
  #grade .band.bot{bottom:0;-webkit-mask:linear-gradient(transparent,#000);mask:linear-gradient(transparent,#000)}
  #grade .vig{position:absolute;inset:0;background:radial-gradient(128% 82% at 50% 44%,transparent 62%,rgba(70,92,120,.18))}

  .screen{position:absolute;inset:0;display:flex;flex-direction:column;z-index:20}
  .screen[hidden]{display:none}
  .panel{background:var(--panel);border:1px solid rgba(217,138,31,.4);backdrop-filter:blur(3px);
    box-shadow:0 8px 24px rgba(60,80,110,.14);
    clip-path:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px)}
  .eyebrow{font-size:10px;letter-spacing:.28em;color:var(--lantern-dim);text-transform:uppercase;font-family:var(--mono)}
  button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer}
  .btn{font-family:var(--mincho);font-size:15px;letter-spacing:.12em;padding:13px 18px;
    background:linear-gradient(180deg,#ffe9bc,#f6cd78);
    border:1px solid rgba(165,102,15,.55);color:#5a3a08;
    clip-path:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px);transition:background .15s,transform .1s}
  .btn:active{transform:translateY(1px);background:linear-gradient(180deg,#f6cd78,#eab54f)}
  .btn.ghost{background:rgba(255,255,255,.82);border-color:rgba(46,52,66,.22);color:var(--ink)}
  :focus-visible{outline:2px solid var(--lantern);outline-offset:2px}

  /* タイトル */
  #titleScreen{justify-content:flex-end;padding:0 26px 54px;z-index:30;
    background:radial-gradient(120% 82% at 50% 14%,#cfe6fb 0%,#eaf1f8 46%,#f6f1e5 100%)}
  .logo{font-family:var(--mincho);line-height:1.05}
  .logo .ja{display:block;font-size:13px;letter-spacing:.5em;color:var(--lantern-dim);margin-bottom:14px}
  .logo .en{display:block;font-size:38px;background:linear-gradient(180deg,#f0a92e,#b96f14 62%,#8a4f0c);
    -webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 1px 0 rgba(255,255,255,.5)}
  .logo .en small{display:block;font-size:26px;letter-spacing:.18em;margin-top:2px}
  #titleScreen p.lead{font-size:12.5px;line-height:1.9;color:var(--paper-dim);margin:20px 0 30px;max-width:300px}
  #titleScreen .btn{width:100%;text-align:center;font-size:16px}
  .demo-tag{position:absolute;top:14px;left:14px;font-family:var(--mono);font-size:9px;letter-spacing:.2em;
    color:var(--lantern-dim);background:rgba(255,255,255,.7);border:1px solid rgba(217,138,31,.45);padding:4px 8px}

  /* キャラクリエイト */
  #createScreen{background:radial-gradient(110% 72% at 50% 0%,#d6e9fb,#f6f1e5 62%);padding:16px 16px 12px;gap:10px;z-index:30}
  .cc-head{display:flex;align-items:baseline;justify-content:space-between}
  .cc-head h2{font-family:var(--mincho);font-size:18px;letter-spacing:.16em;margin:2px 0 0}
  #ccStage{position:relative;height:186px;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(60% 46% at 50% 78%,rgba(217,138,31,.20),transparent 70%),linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0));
    border-bottom:1px solid rgba(217,138,31,.28)}
  #ccChar{width:146px;height:174px;image-rendering:pixelated}
  #ccStage .floor{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);width:130px;height:16px;
    background:radial-gradient(50% 50% at 50% 50%,rgba(60,80,110,.32),transparent 70%)}
  .rows{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:7px;padding-right:2px}
  .row{display:flex;align-items:center;gap:8px;padding:7px 10px;background:rgba(255,255,255,.78);border:1px solid rgba(46,52,66,.10)}
  .row .lbl{font-size:12px;letter-spacing:.1em;flex:1;color:var(--paper-dim)}
  .row .val{font-family:var(--mono);font-size:12px;min-width:78px;text-align:right}
  .arrow{width:30px;height:30px;display:grid;place-items:center;font-size:13px;color:var(--lantern-dim);
    border:1px solid rgba(217,138,31,.4);background:rgba(217,138,31,.12)}
  .arrow:active{background:rgba(217,138,31,.34)}
  .swatches{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  .sw{width:22px;height:22px;border:1px solid rgba(0,0,0,.28);box-shadow:0 0 0 1px rgba(46,52,66,.12)}
  .sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--lantern)}
  #nameInput{flex:1;background:#fff;border:1px solid rgba(46,52,66,.22);color:var(--ink);
    font-family:var(--mincho);font-size:15px;padding:8px 10px;letter-spacing:.08em;min-width:0}
  .cc-foot{display:flex;gap:8px}
  .cc-foot .btn{flex:1;text-align:center}
  .cc-foot .btn.ghost{flex:0 0 96px}

  /* HUD */
  #gameScreen{pointer-events:none;background:none;z-index:20}
  #gameScreen>*{pointer-events:auto}
  #topbar{position:absolute;top:0;left:0;right:0;padding:10px 12px;display:flex;gap:8px;align-items:center;z-index:8;
    background:linear-gradient(180deg,rgba(246,241,229,.92),rgba(246,241,229,0))}
  .mode{font-family:var(--mincho);font-size:11px;letter-spacing:.18em;padding:5px 9px;border:1px solid rgba(46,160,110,.55);
    color:#1c855b;background:rgba(210,244,230,.85)}
  .stat{display:flex;align-items:center;gap:5px;font-family:var(--mono);font-size:12px;color:var(--ink)}
  .stat b{color:var(--lantern-dim);font-size:13px}
  .stat span{font-size:9px;color:var(--paper-dim);letter-spacing:.14em}
  #missionCount{margin-left:auto}
  .legend{position:absolute;right:10px;top:52px;font-size:9px;line-height:1.7;font-family:var(--mono);
    color:var(--ink);text-align:right;text-shadow:0 1px 2px rgba(255,255,255,.9);z-index:8}
  .legend i{display:inline-block;width:7px;height:7px;margin-right:4px;vertical-align:middle;box-shadow:0 0 0 1px rgba(0,0,0,.15)}
  #banner{position:absolute;top:46px;left:12px;right:12px;padding:8px 10px;font-size:11.5px;line-height:1.6;z-index:8;color:var(--ink);
    background:rgba(255,244,240,.96);border-left:3px solid var(--alert);box-shadow:0 6px 18px rgba(60,80,110,.16);opacity:0;transform:translateY(-6px);transition:.25s}
  #banner.on{opacity:1;transform:none}
  #toast{position:absolute;left:12px;right:12px;bottom:206px;display:flex;flex-direction:column;gap:6px;align-items:center;z-index:8}
  .toast{font-size:12px;padding:9px 14px;color:var(--ink);background:rgba(255,255,255,.96);border:1px solid rgba(217,138,31,.5);box-shadow:0 6px 18px rgba(60,80,110,.16);animation:pop .3s}
  .toast b{color:var(--lantern-dim);font-family:var(--mono)}
  @keyframes pop{from{opacity:0;transform:translateY(8px) scale(.96)}to{opacity:1;transform:none}}

  #avatarWin{position:absolute;right:10px;bottom:176px;width:96px;padding:6px 6px 7px;display:flex;flex-direction:column;align-items:center;gap:3px;z-index:8}
  #avatarCanvas{width:60px;height:72px;image-rendering:pixelated}
  #avatarName{font-family:var(--mincho);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  #avatarState{font-family:var(--mono);font-size:9px;color:var(--paper-dim)}

  #stick{position:absolute;left:16px;bottom:24px;width:112px;height:112px;border-radius:50%;z-index:8;
    background:radial-gradient(50% 50% at 50% 50%,rgba(255,255,255,.7),rgba(255,255,255,.35));border:1px solid rgba(46,52,66,.2);box-shadow:0 4px 14px rgba(60,80,110,.18);touch-action:none}
  #knob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;
    background:radial-gradient(50% 50% at 40% 35%,#fff3d4,#e9b949 60%,#a5660f);box-shadow:0 3px 10px rgba(80,50,0,.45)}
  #actionBtn{position:absolute;right:14px;bottom:26px;width:76px;height:76px;border-radius:50%;z-index:8;color:#5a3a08;
    font-family:var(--mincho);font-size:14px;letter-spacing:.1em;
    background:radial-gradient(60% 60% at 40% 32%,#ffe6b0,#f0b64c);border:1px solid rgba(165,102,15,.75);box-shadow:0 5px 16px rgba(120,80,0,.28);
    opacity:0;transform:scale(.85);transition:.18s;pointer-events:none}
  #actionBtn.on{opacity:1;transform:none;pointer-events:auto}
  #hintTag{position:absolute;left:50%;transform:translateX(-50%);bottom:150px;font-size:11px;z-index:8;color:var(--ink);
    padding:5px 10px;background:rgba(255,255,255,.92);border:1px solid rgba(46,52,66,.2);box-shadow:0 4px 12px rgba(60,80,110,.15);opacity:0;transition:.2s;white-space:nowrap}
  #hintTag.on{opacity:1}

  #modal{position:absolute;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;background:rgba(30,42,64,.42);padding:0 14px 20px}
  #modal[hidden]{display:none}
  #modalBox{width:100%;padding:16px}
  #modalKind{font-family:var(--mono);font-size:9px;letter-spacing:.22em;color:var(--lantern-dim)}
  #modalTitle{font-family:var(--mincho);font-size:17px;letter-spacing:.08em;margin:6px 0 8px}
  #modalBody{font-size:12.5px;line-height:1.85;color:var(--paper-dim);margin-bottom:14px}
  #modalOpts{display:flex;flex-direction:column;gap:7px}
  #modalOpts .btn{text-align:left;font-size:14px;padding:11px 14px}
  .reward{font-family:var(--mono);font-size:11px;color:var(--lantern-dim);margin-top:10px;text-align:right}

  #bagBtn{position:absolute;right:33px;bottom:124px;z-index:9;width:50px;height:50px;border-radius:14px;font-size:21px;
    background:rgba(255,255,255,.92);border:1px solid rgba(217,138,31,.5);box-shadow:0 4px 12px rgba(60,80,110,.18);
    display:flex;align-items:center;justify-content:center}
  #bagBtn b{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;
    background:var(--lantern);color:#3a2708;font:600 11px var(--mono,monospace);display:flex;align-items:center;justify-content:center}
  #modalArt{font-size:40px;text-align:center;margin:2px 0 6px;line-height:1}

  /* 防災リュック画面 */
  #bagScreen{z-index:38;background:radial-gradient(120% 80% at 50% 0%,#dcebfb,#f6f1e5 60%);padding:16px 16px 18px;gap:12px;overflow-y:auto}
  .bag-head{display:flex;align-items:baseline;justify-content:space-between}
  .bag-head h2{font-family:var(--mincho);font-size:20px;letter-spacing:.16em;margin:2px 0 0}
  #bagChar{position:relative;display:flex;align-items:center;gap:14px;justify-content:center;
    background:radial-gradient(60% 60% at 30% 70%,rgba(217,138,31,.16),transparent 70%);padding:6px 0}
  #bagCanvas{width:120px;height:154px;image-rendering:pixelated}
  #bagStats{display:flex;flex-direction:column;gap:6px;font-size:12px}
  #bagStats .s{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.7);border:1px solid rgba(46,52,66,.1);padding:5px 10px}
  #bagStats .s b{font-family:var(--mono);color:var(--lantern-dim);min-width:20px;text-align:right}
  #bagSlots{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
  .slot{background:rgba(255,255,255,.72);border:1px solid rgba(46,52,66,.12);border-radius:8px;padding:6px 2px;text-align:center;min-height:56px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
  .slot .sn{font-size:9px;color:var(--paper-dim)}
  .slot .si{font-size:20px;line-height:1}
  .slot .st{font-size:9px;line-height:1.2;color:var(--ink)}
  .slot.filled{border-color:rgba(217,138,31,.6);background:rgba(255,247,230,.9)}
  .bag-sub{font-family:var(--mincho);font-size:14px;letter-spacing:.1em;display:flex;justify-content:space-between;align-items:baseline;
    border-bottom:1px solid rgba(217,138,31,.3);padding-bottom:4px}
  .bag-sub span{font-family:var(--mono);font-size:12px;color:var(--lantern-dim)}
  #bagGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
  .card{display:flex;gap:8px;align-items:flex-start;background:rgba(255,255,255,.78);border:1px solid rgba(46,52,66,.12);
    border-radius:10px;padding:8px 9px;min-height:64px}
  .card.locked{opacity:.72;filter:grayscale(.4)}
  .card.equipped{border-color:rgba(217,138,31,.7);background:rgba(255,247,230,.92);box-shadow:0 3px 10px rgba(180,120,20,.15)}
  .card .ic{font-size:24px;line-height:1;flex:0 0 auto;width:30px;text-align:center}
  .card .meta{flex:1;min-width:0}
  .card .nm{font-size:12px;font-weight:600;letter-spacing:.02em}
  .card .ef{font-size:10px;color:var(--lantern-dim);font-family:var(--mono);margin-top:1px}
  .card .us{font-size:10px;color:var(--paper-dim);margin-top:2px;line-height:1.4}
  .card .lk{font-size:10px;color:var(--paper-dim);margin-top:2px;line-height:1.4}
  .card .tag{display:inline-block;font-size:9px;margin-top:3px;padding:1px 6px;border-radius:8px;background:rgba(217,138,31,.18);color:var(--lantern-dim)}
  .bag-note{font-size:11px;line-height:1.7;color:var(--paper-dim);text-align:center;margin-top:2px}

  #loading{position:absolute;inset:0;z-index:35;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;
    background:radial-gradient(120% 82% at 50% 30%,#d6e9fb,#f6f1e5);font-family:var(--mincho);letter-spacing:.14em;color:var(--paper-dim)}
  #loading .spin{width:26px;height:26px;border:2px solid rgba(217,138,31,.3);border-top-color:var(--lantern);border-radius:50%;animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="phone"><div id="stage">
  <div id="map"><canvas id="mapcanvas"></canvas></div>
  <div id="realmap"></div>
  <canvas id="overlay"></canvas>
  <div id="grade"><div class="band top"></div><div class="band bot"></div><div class="vig"></div></div>

  <!-- タイトル -->
  <section class="screen" id="titleScreen">
    <div class="demo-tag">DEMO / 実地図 · 平時モード</div>
    <div class="logo"><span class="ja">寄り道が、まちを守る</span>
      <span class="en">YORIMICHI<small>QUEST</small></span></div>
    <p class="lead">いつもの散歩に、ひとつ寄り道を。歩いた道と点検の記録が、そのまま地域の防災データになります。</p>
    <button class="btn" id="toCreate">冒険者をつくる</button>
  </section>

  <!-- キャラクリエイト -->
  <section class="screen" id="createScreen" hidden>
    <div class="cc-head"><div><div class="eyebrow">STEP 01 / 02</div><h2>冒険者をつくる</h2></div>
      <button class="btn ghost" id="randomBtn" style="padding:8px 12px;font-size:12px">おまかせ</button></div>
    <div id="ccStage"><div class="floor"></div><canvas id="ccChar" width="168" height="216"></canvas></div>
    <div class="rows" id="ccRows"></div>
    <div class="row" style="gap:10px"><span class="lbl" style="flex:0 0 auto">なまえ</span>
      <input id="nameInput" maxlength="8" value="ヨリ" autocomplete="off"></div>
    <div class="cc-foot"><button class="btn ghost" id="backTitle">もどる</button>
      <button class="btn" id="startGame">まちへ出る</button></div>
  </section>

  <!-- ゲーム -->
  <section class="screen" id="gameScreen" hidden>
    <div id="topbar">
      <div class="mode">平時モード</div>
      <div class="stat"><span>PT</span><b id="ptVal">0</b></div>
      <div class="stat"><span>メダル</span><b id="medalVal">0</b></div>
      <div class="stat" id="missionCount"><span>点検</span><b><span id="doneVal">0</span>/<span id="totalVal">6</span></b></div>
    </div>
    <div class="legend"><div><i style="background:#e9b949"></i>ミッション</div>
      <div><i style="background:#3aa5e0"></i>浸水想定エリア</div></div>
    <div id="banner"></div>
    <div id="toast"></div>
    <div class="panel" id="avatarWin">
      <canvas id="avatarCanvas" width="60" height="72"></canvas>
      <div id="avatarName">ヨリ</div>
      <div id="avatarState">Lv.1</div>
    </div>
    <div id="hintTag">近づいて調べてみよう</div>
    <button id="bagBtn" aria-label="防災リュック">🎒<b id="bagCount">0</b></button>
    <div id="stick"><div id="knob"></div></div>
    <button id="actionBtn">調べる</button>
  </section>

  <section class="screen" id="bagScreen" hidden>
    <div class="bag-head"><div><div class="eyebrow">MY EMERGENCY KIT</div><h2>防災リュック</h2></div>
      <button class="btn ghost" id="bagClose" style="padding:8px 14px;font-size:13px">とじる</button></div>
    <div id="bagChar"><canvas id="bagCanvas" width="168" height="216"></canvas>
      <div id="bagStats"></div></div>
    <div id="bagSlots"></div>
    <div class="bag-sub">図鑑 <span id="bagProgress">0 / 10</span></div>
    <div id="bagGrid"></div>
    <div class="bag-note">集めた装備は、災害が起きたとき「わが家の備え」として役立ちます。</div>
  </section>

  <div id="modal" hidden><div class="panel" id="modalBox">
    <div id="modalKind">MISSION</div><h3 id="modalTitle"></h3><div id="modalArt"></div><p id="modalBody"></p>
    <div id="modalOpts"></div><div class="reward" id="modalReward"></div></div></div>

  <div id="loading"><div class="spin"></div><div>まちを読み込んでいます…</div></div>
</div></div>

<script>
(()=>{ 'use strict';
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;

/* ===== MapLibreを非ブロッキングで動的読み込み（失敗しても本体は動く） ===== */
let maplibreState='loading'; // loading | ok | fail
(function loadMapLibre(){
  try{
    const css=document.createElement('link');css.rel='stylesheet';
    css.href='https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.css';
    document.head.appendChild(css);
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.js';
    s.async=true;
    s.onload=()=>{maplibreState='ok';};
    s.onerror=()=>{maplibreState='fail';};
    document.head.appendChild(s);
    setTimeout(()=>{if(maplibreState==='loading')maplibreState='fail';},7000);
  }catch(e){maplibreState='fail';}
})();

    else if(A(x-1,y)||A(x+1,y)||A(x,y-1)||A(x,y+1)||A(x-1,y-1)||A(x+1,y-1)||A(x-1,y+1)||A(x+1,y+1)){

function rectPoly(e0,n0,e1,n1){return[[off(e0,n0),off(e1,n0),off(e1,n1),off(e0,n1),off(e0,n0)]];}
const floodPolys=[

const floodGeo={type:'FeatureCollection',features:floodPolys.map(c=>({type:'Feature',geometry:{type:'Polygon',coordinates:c},properties:{}}))};
function pointInPoly(pt,poly){let x=pt[0],y=pt[1],inside=false,r=poly[0];
  for(let i=0,j=r.length-1;i<r.length;j=i++){const xi=r[i][0],yi=r[i][1],xj=r[j][0],yj=r[j][1];
    if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))inside=!inside;}return inside;}
function inFlood(ll){return floodPolys.some(p=>pointInPoly(ll,p));}
function distM(a,b){const dx=(a[0]-b[0])*mPerLng,dy=(a[1]-b[1])*mPerLat;return Math.hypot(dx,dy);}

/* ---- オフラインでも動くMapbox風の街並みマップ ---- */
const MPP=0.8;                       // メートル/ピクセル
const emv=ll=>(ll[0]-CENTER[0])*mPerLng, nmv=ll=>(ll[1]-CENTER[1])*mPerLat;
let offCenter=[...CENTER];
function rngf(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const WORLD=(()=>{
  const rand=rngf(4821),roads=[],buildings=[],parks=[],labels=[],EXT=1200;
  const river={pts:[],w:34};
  for(let s=-EXT;s<=EXT;s+=40)river.pts.push([s*0.55+Math.sin(s/160)*70,-s*0.55+Math.cos(s/130)*50]);
  const inRiver=(e,n)=>{let md=1e9;for(let i=0;i<river.pts.length-1;i++){const[x1,y1]=river.pts[i],[x2,y2]=river.pts[i+1];
    const dx=x2-x1,dy=y2-y1,L=dx*dx+dy*dy;let t=((e-x1)*dx+(n-y1)*dy)/L;t=Math.max(0,Math.min(1,t));
    md=Math.min(md,Math.hypot(e-(x1+dx*t),n-(y1+dy*t)));}return md<river.w/2+6;};
  const lH=[],lV=[];
  for(let n=-EXT;n<=EXT;n+=78)lH.push({n:n+(rand()*16-8),major:(Math.round(n/78))%3===0});
  for(let e=-EXT;e<=EXT;e+=78)lV.push({e:e+(rand()*16-8),major:(Math.round(e/78))%3===0});
  lH.forEach(h=>roads.push({a:[-EXT,h.n],b:[EXT,h.n],major:h.major}));
  lV.forEach(v=>roads.push({a:[v.e,-EXT],b:[v.e,EXT],major:v.major}));
  roads.push({a:[-EXT,-EXT*0.6],b:[EXT,EXT*0.6],avenue:true});
  parks.push({e:-260,n:150,w:150,h:120,name:'みどり中央公園'});
  parks.push({e:210,n:-230,w:130,h:100,name:'かわせみ公園'});
  const inPark=(e,n)=>parks.some(p=>e>p.e-p.w/2&&e<p.e+p.w/2&&n>p.n-p.h/2&&n<p.n+p.h/2);
  for(let hi=0;hi<lH.length-1;hi++)for(let vi=0;vi<lV.length-1;vi++){
    const n0=lH[hi].n,n1=lH[hi+1].n,e0=lV[vi].e,e1=lV[vi+1].e,pad=7;
    const be0=e0+pad,be1=e1-pad,bn0=n0+pad,bn1=n1-pad;
    if(be1-be0<14||bn1-bn0<14)continue;
    const cols=1+Math.floor(rand()*2),rows=1+Math.floor(rand()*2);
    for(let ci=0;ci<cols;ci++)for(let ri=0;ri<rows;ri++){
      const gw=(be1-be0)/cols,gh=(bn1-bn0)/rows,g2=3;
      const x=be0+ci*gw+g2,y=bn0+ri*gh+g2,w=gw-g2*2,h=gh-g2*2;
      if(w<8||h<8)continue;const cx=x+w/2,cy=y+h/2;
      if(inRiver(cx,cy)||inPark(cx,cy))continue;
      buildings.push({x,y,w,h,tall:rand()<.18});}}
  labels.push({e:0,n:8,text:'よりみち駅',kind:'station'});
  labels.push({e:0,n:lH[Math.floor(lH.length/2)].n,text:'さくら通り',kind:'road',horiz:true});
  labels.push({e:lV[Math.floor(lV.length/2)].e,n:0,text:'本町通り',kind:'road',horiz:false});
  const rm=river.pts[Math.floor(river.pts.length/2)];labels.push({e:rm[0],n:rm[1],text:'よりみち川',kind:'water'});
  parks.forEach(p=>labels.push({e:p.e,n:p.n,text:p.name,kind:'park'}));
  return {roads,buildings,parks,river,labels};
})();
const MC={land:'#eef0e6',park:'#cfe3bf',parkE:'#bcd8a9',water:'#a9d3ec',waterE:'#8fc3e2',
  bldg:'#e3ddcd',bldgTall:'#dcd4bf',bldgLine:'#cfc7b2',bldgShadow:'rgba(90,80,60,.16)',
  casMajor:'#e7c98a',casMinor:'#d9d2c2',fill:'#ffffff',avenueFill:'#fff4d6',
  label:'#5c5647',labelWater:'#3f7fa8',labelPark:'#3f7a3a',station:'#c8503f'};
function drawOfflineMap(){
  const r=$('#stage').getBoundingClientRect(),W=r.width,H=r.height,g=mcx;
  const cx=emv(offCenter),cy=nmv(offCenter);
  const P=(e,n)=>[W/2+(e-cx)/MPP,H*0.5-(n-cy)/MPP];
  g.clearRect(0,0,W,H);g.fillStyle=MC.land;g.fillRect(0,0,W,H);
  WORLD.parks.forEach(p=>{const[x,y]=P(p.e-p.w/2,p.n+p.h/2),w=p.w/MPP,h=p.h/MPP;
    g.fillStyle=MC.park;g.fillRect(x,y,w,h);g.strokeStyle=MC.parkE;g.lineWidth=1.5;g.strokeRect(x,y,w,h);});
  g.lineCap='round';g.lineJoin='round';
  const riverPath=()=>{g.beginPath();WORLD.river.pts.forEach((p,i)=>{const[x,y]=P(p[0],p[1]);i?g.lineTo(x,y):g.moveTo(x,y);});};
  g.strokeStyle=MC.waterE;g.lineWidth=WORLD.river.w/MPP+3;riverPath();g.stroke();
  g.strokeStyle=MC.water;g.lineWidth=WORLD.river.w/MPP;riverPath();g.stroke();
  WORLD.buildings.forEach(b=>{const[x,y]=P(b.x,b.y+b.h),w=b.w/MPP,h=b.h/MPP;
    if(x<-40||x>W+40||y<-40||y>H+40)return;g.fillStyle=MC.bldgShadow;g.fillRect(x+2,y+2,w,h);});
  WORLD.buildings.forEach(b=>{const[x,y]=P(b.x,b.y+b.h),w=b.w/MPP,h=b.h/MPP;
    if(x<-40||x>W+40||y<-40||y>H+40)return;g.fillStyle=b.tall?MC.bldgTall:MC.bldg;g.fillRect(x,y,w,h);
    g.strokeStyle=MC.bldgLine;g.lineWidth=1;g.strokeRect(x+.5,y+.5,w-1,h-1);});
  const seg=(rd,ww,c)=>{const[ax,ay]=P(rd.a[0],rd.a[1]),[bx,by]=P(rd.b[0],rd.b[1]);
    g.strokeStyle=c;g.lineWidth=ww;g.beginPath();g.moveTo(ax,ay);g.lineTo(bx,by);g.stroke();};
  WORLD.roads.forEach(rd=>{const base=rd.avenue?11:rd.major?8:5;seg(rd,base+3,rd.major||rd.avenue?MC.casMajor:MC.casMinor);});
  WORLD.roads.forEach(rd=>{const base=rd.avenue?11:rd.major?8:5;seg(rd,base,rd.avenue?MC.avenueFill:MC.fill);});
  // 浸水想定エリア
  const pulse=.22+0.10*Math.abs(Math.sin(time/700));
  floodPolys.forEach(poly=>{g.beginPath();poly[0].forEach((ll,i)=>{const[x,y]=P(emv(ll),nmv(ll));i?g.lineTo(x,y):g.moveTo(x,y);});
    g.closePath();g.fillStyle='rgba(58,165,224,'+pulse+')';g.fill();
    g.strokeStyle='rgba(63,127,168,.9)';g.setLineDash([5,4]);g.lineWidth=1.4;g.stroke();g.setLineDash([]);});
  // ラベル
  g.textAlign='center';g.textBaseline='middle';
  WORLD.labels.forEach(l=>{const[x,y]=P(l.e,l.n);if(x<-30||x>W+30||y<-20||y>H+20)return;
    if(l.kind==='station'){g.fillStyle=MC.station;g.beginPath();g.arc(x,y,5,0,7);g.fill();
      g.fillStyle='#fff';g.beginPath();g.arc(x,y,2,0,7);g.fill();
      g.font='bold 13px sans-serif';g.lineWidth=3;g.strokeStyle='rgba(255,255,255,.9)';
      g.strokeText(l.text,x,y-13);g.fillStyle=MC.station;g.fillText(l.text,x,y-13);
    }else{g.font=((l.kind==='park'||l.kind==='water')?'12px':'11px')+' sans-serif';g.save();
      if(l.kind==='road'&&l.horiz===false){g.translate(x,y);g.rotate(-Math.PI/2);g.translate(-x,-y);}
      g.lineWidth=3;g.strokeStyle='rgba(255,255,255,.85)';g.strokeText(l.text,x,y);
      g.fillStyle=l.kind==='water'?MC.labelWater:l.kind==='park'?MC.labelPark:MC.label;g.fillText(l.text,x,y);g.restore();}});
}
function makeOfflineMap(){

/* ---- ネットがあれば本物の実地図へ差し替え ---- */
function upgradeToRealMap(){
  let real;
  try{
    real=new maplibregl.Map({container:'realmap',
      style:'https://tiles.openfreemap.org/styles/liberty',
      center:player.ll, zoom:17.4, pitch:54, bearing:-18,
      attributionControl:{compact:true}, interactive:false, fadeDuration:0});
  }catch(e){ return; }
  real.on('error',e=>console.warn('map',e&&e.error));
  real.on('load',()=>{
    try{let labelId;for(const l of real.getStyle().layers){if(l.type==='symbol'){labelId=l.id;break;}}
      real.addLayer({id:'ymq-3d',source:'openmaptiles','source-layer':'building',type:'fill-extrusion',minzoom:14,
        paint:{'fill-extrusion-color':'#e6ddc9','fill-extrusion-height':['coalesce',['get','render_height'],8],
          'fill-extrusion-base':['coalesce',['get','render_min_height'],0],'fill-extrusion-opacity':.9}},labelId);}catch(e){}
    try{real.addSource('flood',{type:'geojson',data:floodGeo});
      real.addLayer({id:'flood-fill',source:'flood',type:'fill',paint:{'fill-color':'#3aa5e0','fill-opacity':.32}});
      real.addLayer({id:'flood-line',source:'flood',type:'line',paint:{'line-color':'#8fd6ff','line-width':1.4,'line-dasharray':[2,2]}});
      let fp=0;setInterval(()=>{if(!real.getLayer('flood-fill'))return;fp=(fp+1)%40;
        real.setPaintProperty('flood-fill','fill-opacity',.26+0.10*Math.abs(Math.sin(fp/6)));},120);}catch(e){}
    // 切り替え
    real.setCenter(player.ll);
    map=real; usingOffline=false;
    $('#realmap').style.display='block'; $('#map').style.display='none';
    banner('実地図に接続しました。');
  });
}
function startMap(){
  // まず必ずオフライン地図で即表示（イメージが確実に伝わるように）
  map=makeOfflineMap(); usingOffline=true; hideLoading(); drawOfflineMap();
  // 実地図が使えるなら裏で読み込んで差し替え
  const t0=performance.now();
  (function wait(){
    if(!usingOffline)return;
    if(typeof maplibregl!=='undefined'&&maplibreState==='ok'){upgradeToRealMap();return;}
    if(maplibreState==='fail'||performance.now()-t0>8000){
      setTimeout(()=>banner('この環境では実地図タイルに接続できないため、内蔵マップで表示しています。'),1500);return;}
    setTimeout(wait,200);
  })();
}

    toilet:[[-2,-2,1,4],[1,-2,1,4]],water:[[0,-2,1,3],[-1,1,2,1]],flood:[[-2,0,4,1],[-2,2,4,1]]};

const stick=$('#stick'),knob=$('#knob');let stickId=null;
function stickMove(e){const t=[...(e.touches||[])].find(t=>t.identifier===stickId)||e;
  const r=stick.getBoundingClientRect();let dx=t.clientX-(r.left+r.width/2),dy=t.clientY-(r.top+r.height/2);
  const d=Math.hypot(dx,dy),max=34;if(d>max){dx=dx/d*max;dy=dy/d*max;}
  knob.style.transform=`translate(${dx}px,${dy}px)`;mv.x=dx/max;mv.y=dy/max;}
stick.addEventListener('touchstart',e=>{e.preventDefault();stickId=e.changedTouches[0].identifier;stickMove(e);},{passive:false});
stick.addEventListener('touchmove',e=>{e.preventDefault();stickMove(e);},{passive:false});
stick.addEventListener('touchend',()=>{stickId=null;mv.x=mv.y=0;knob.style.transform='';});
stick.addEventListener('mousedown',e=>{stickId='m';stickMove(e);
  const mm=ev=>stickMove(ev),mu=()=>{mv.x=mv.y=0;knob.style.transform='';removeEventListener('mousemove',mm);removeEventListener('mouseup',mu);};
  addEventListener('mousemove',mm);addEventListener('mouseup',mu);});

/* ===== ループ ===== */
let time=0,last=0,pt=0,medal=0,done=0,nearPoi=null;
const avCx=$('#avatarCanvas').getContext('2d');
function update(dt,t){
  let ix=mv.x,iy=mv.y;
  if(keys.ArrowLeft||keys.a)ix=-1;if(keys.ArrowRight||keys.d)ix=1;
  if(keys.ArrowUp||keys.w)iy=-1;if(keys.ArrowDown||keys.s)iy=1;
  const mag=Math.hypot(ix,iy);player.moving=mag>0.15;
  if(player.moving){
    const mps=22, step=mps*dt/1000; // 一定速度 m/s
    const br=(map?map.getBearing():0)*Math.PI/180;
    let vx=ix/mag,vy=iy/mag;
    const rx=vx*Math.cos(br)-vy*Math.sin(br), ry=vx*Math.sin(br)+vy*Math.cos(br);
    player.ll=[player.ll[0]+rx*step/mPerLng, player.ll[1]-ry*step/mPerLat];
    player.dir=Math.abs(ix)>Math.abs(iy)?(ix<0?'left':'right'):(iy<0?'up':'down');
    player.frame=Math.floor(t/140)%4;
    if(map)map.setCenter(player.ll);
  }

  nearPoi=null;let bd=22;
  pois.forEach(p=>{if(p.done)return;const d=distM(p.ll,player.ll);if(d<bd){bd=d;nearPoi=p;}});
  $('#actionBtn').classList.toggle('on',!!nearPoi&&$('#modal').hidden);
  $('#hintTag').classList.toggle('on',!!nearPoi&&$('#modal').hidden);
  if(nearPoi)$('#hintTag').textContent=nearPoi.t+'：'+nearPoi.n;

  const wetNow=inFlood(player.ll)?1:0;
  avCx.clearRect(0,0,60,72);avCx.imageSmoothingEnabled=false;
  {const as=1.9,aw=SPW*as,ah=SPH*as;avCx.drawImage(bakeSprite({...avatar,frame:player.frame,moving:player.moving,dir:'down',wet:wetNow,time:t,equips:equipLayers()}),0,0,SPW,SPH,(60-aw)/2,72-ah,aw,ah);}
  const st=$('#avatarState');st.textContent='Lv.'+(1+Math.floor(pt/200))+(wetNow?' ／ 浸水中':'');
  st.style.color=wetNow?'var(--flood)':'';
}
function renderOverlay(t){
  const w=overlay.width/dpr,h=overlay.height/dpr;ocx.clearRect(0,0,w,h);
  if(!map)return;
  const ents=[];
  pois.forEach(p=>{const q=map.project(p.ll);ents.push({y:q.y,d:()=>drawPin(p,q.x,q.y,t)});});
  const pp=map.project(player.ll);ents.push({y:pp.y,d:()=>drawPlayerAt(pp.x,pp.y,t)});
  ents.sort((a,b)=>a.y-b.y).forEach(e=>e.d());
}
function loop(t){const dt=Math.min(48,t-last||16);last=t;time=t;
  if(!$('#gameScreen').hidden){update(dt,t);if(usingOffline)drawOfflineMap();renderOverlay(t);}
  if(!$('#createScreen').hidden)drawCC(t);
  requestAnimationFrame(loop);}
requestAnimationFrame(loop);

/* ===== ミッションUI ===== */
function toast(html){const el=document.createElement('div');el.className='toast';el.innerHTML=html;$('#toast').appendChild(el);
  setTimeout(()=>{el.style.transition='opacity .4s';el.style.opacity='0';setTimeout(()=>el.remove(),420);},2600);}
let bt;function banner(txt){const b=$('#banner');b.textContent=txt;b.classList.add('on');clearTimeout(bt);bt=setTimeout(()=>b.classList.remove('on'),6000);}
function tryAction(){if(nearPoi&&$('#modal').hidden)openMission(nearPoi);}
$('#actionBtn').onclick=tryAction;
/* ===== モーダル汎用ヘルパー ===== */
function showModal({kind,title,art,body,reward,opts}){
  $('#modalKind').textContent=kind||'';
  $('#modalTitle').textContent=title||'';
  $('#modalArt').textContent=art||''; $('#modalArt').style.display=art?'block':'none';
  $('#modalBody').innerHTML=body||'';
  $('#modalReward').textContent=reward||'';
  const box=$('#modalOpts');box.innerHTML='';
  (opts||[]).forEach(o=>{const b=document.createElement('button');b.className='btn'+(o.ghost?' ghost':'');
    b.textContent=o.label;b.onclick=o.onClick;box.appendChild(b);});
  $('#modal').hidden=false;
}
function closeModal(){$('#modal').hidden=true;}

/* ===== ①スポット到達：点検クイズ ===== */
function openMission(p){
  showModal({kind:p.medal?'点検 / メダル':'点検',title:p.n,body:p.q,
    reward:'報酬 +'+p.pt+' 東京ポイント'+(p.medal?' ／ デジタルメダル ×1':''),
    opts:[...p.opts.map(o=>({label:o,onClick:()=>reportDone(p)})),{label:'あとで',ghost:true,onClick:closeModal}]});
}
function reportDone(p){
  if(!p.done){p.done=true;done++;pt+=p.pt;if(p.medal)medal++;
    $('#ptVal').textContent=pt;$('#medalVal').textContent=medal;$('#doneVal').textContent=done;
    toast('報告ありがとう <b>+'+p.pt+'pt</b>');
    setTimeout(()=>toast('AIが検品 → <b>オープンデータに反映</b>'),700);}
  // ②スポットドロップ（防災グッズ・必ず）
  grantItem(p.drop,()=>startBattle(p));
}

/* ===== ②③アイテム付与（共通） ===== */
function grantItem(key,next){
  const it=ITEMS[key]; const isNew=acquire(key); updateBagCount();
  const ef=statLabel(it.stats);
  showModal({kind:it.src==='battle'?'装備を手に入れた':'防災グッズを手に入れた',
    title:it.name, art:ITEM_EMOJI[key]||'🎁',
    body:'<b style="color:var(--lantern-dim)">'+SLOT_NAMES[it.slot]+'</b>　'+ef+
      '<br><span style="color:var(--paper-dim)">避難時：'+it.use+'</span>'+
      (isNew?'':'<br><span style="color:var(--paper-dim)">（すでに持っています）</span>'),
    opts:[{label:'つづける',onClick:()=>{closeModal();if(next)next();}}]});
}

/* ===== ③敵バトル ===== */
let curEnemy=null;
function startBattle(p){
  const e=ENEMIES[p.enemy];curEnemy=e;
  showModal({kind:'災害があらわれた',title:e.name,art:e.emoji,
    body:'<span style="color:var(--paper-dim)">'+e.intro+'</span>',
    opts:[{label:'クイズでたたかう',onClick:()=>battleQuiz(p)}]});
}
function battleQuiz(p){
  const e=ENEMIES[p.enemy], pool=QUIZ[e.cat];
  const q=pool[Math.floor(Math.random()*pool.length)];
  // ヒント：選択肢を減らす（正解＋最低1つは残す）
  const hint=totalStats().hint;
  let idxs=q.opts.map((_,i)=>i);
  if(hint>0){const wrong=idxs.filter(i=>i!==q.a);
    for(let k=0;k<hint && wrong.length>1;k++){const r=wrong.splice(Math.floor(Math.random()*wrong.length),1)[0];idxs=idxs.filter(i=>i!==r);} }
  const hintNote=hint>0?'<div style="font-size:10px;color:var(--lantern-dim);margin-top:6px">🧤 装備のヒントで選択肢をへらした</div>':'';
  showModal({kind:e.name+' との戦い',title:q.q,art:e.emoji,body:hintNote,
    opts:idxs.map(i=>({label:q.opts[i],onClick:()=>answerBattle(p,i,q)}))});
}
function answerBattle(p,i,q){
  const e=ENEMIES[p.enemy];
  if(i===q.a){
    const bonus=Math.round(60*(1+totalStats().power*0.05));pt+=bonus;$('#ptVal').textContent=pt;
    showModal({kind:'せいかい！',title:e.name+' をたおした',art:'✨',
      body:'<span style="color:var(--paper-dim)">'+q.ex+'</span>',reward:'+'+bonus+' 東京ポイント',
      opts:[{label:'ドロップを受け取る',onClick:()=>grantItem(ENEMY_DROP[e.cat],()=>{closeModal();afterBattle();})}]});
  }else{
    showModal({kind:'ざんねん…',title:'こう考えよう',art:'📖',
      body:'<span style="color:var(--paper-dim)">'+q.ex+'</span>',
      opts:[{label:'もう一度いどむ',onClick:()=>battleQuiz(p)},{label:'にげる',ghost:true,onClick:()=>{closeModal();afterBattle();}}]});
  }
}
function afterBattle(){
  if(done===pois.length)setTimeout(()=>banner('この地区の点検が完走。集まったデータは区の防災ダッシュボードへ届きます。'),400);
}
$('#totalVal').textContent=pois.length;

/* ===== 敵ドロップ対応・アイテム絵文字 ===== */
const ENEMY_DROP={water:'raincoat',fire:'zukin',blackout:'headlight',rumor:'radio'};
const ITEM_EMOJI={helmet:'⛑',whistle:'📣',gloves:'🧤',potatoilet:'🚻',tank:'🚰',book:'📓',
  raincoat:'🧥',zukin:'🧕',headlight:'🔦',radio:'📻'};
function statLabel(st){const m={power:'防災力',time:'回答時間',hint:'ヒント'};
  return Object.keys(st).map(k=>m[k]+' +'+st[k]).join('・');}

/* ===== 防災リュック画面 ===== */
function updateBagCount(){$('#bagCount').textContent=inventory.size;}
const bagCx=$('#bagCanvas').getContext('2d');
function openBag(){ $('#bagScreen').hidden=false; renderBag(); }
function closeBag(){ $('#bagScreen').hidden=true; }
function renderBag(){
  // キャラ姿
  bagCx.clearRect(0,0,168,216);bagCx.imageSmoothingEnabled=false;
  const cs=5.4,cw=SPW*cs,ch=SPH*cs;
  bagCx.drawImage(bakeSprite({...avatar,frame:0,moving:false,dir:'down',wet:0,equips:equipLayers()}),0,0,SPW,SPH,(168-cw)/2,(216-ch)/2,cw,ch);
  // ステータス
  const s=totalStats();
  $('#bagStats').innerHTML=[['防災力',s.power,'スコアが上がる'],['回答時間',s.time,'考える時間に余裕'],['ヒント',s.hint,'選択肢がへる']]
    .map(([n,v,d])=>`<div class="s">${n} <b>+${v}</b> <span style="color:var(--paper-dim);font-size:10px">${d}</span></div>`).join('');
  // スロット
  const slots=['head','body','hand','feet','back'];
  $('#bagSlots').innerHTML=slots.map(sl=>{const k=equipped[sl];
    return `<div class="slot ${k?'filled':''}"><div class="sn">${SLOT_NAMES[sl]}</div>`+
      (k?`<div class="si">${ITEM_EMOJI[k]}</div><div class="st">${ITEMS[k].name}</div>`:`<div class="si" style="opacity:.3">–</div><div class="st" style="color:var(--paper-dim)">なし</div>`)+`</div>`;}).join('');
  // 図鑑
  $('#bagProgress').textContent=inventory.size+' / '+ITEM_ORDER.length;
  $('#bagGrid').innerHTML=ITEM_ORDER.map(key=>{const it=ITEMS[key];const owned=inventory.has(key);
    const isEq=equipped[it.slot]===key;
    if(!owned) return `<div class="card locked"><div class="ic">❓</div><div class="meta">
      <div class="nm">？？？</div><div class="lk">${it.from}</div></div></div>`;
    return `<div class="card ${isEq?'equipped':''}" data-key="${key}"><div class="ic">${ITEM_EMOJI[key]}</div><div class="meta">
      <div class="nm">${it.name}</div><div class="ef">${statLabel(it.stats)}</div>
      <div class="us">避難時：${it.use}</div>
      <span class="tag">${isEq?'装備中 ✓':'タップで装備'}</span></div></div>`;}).join('');
  $('#bagGrid').querySelectorAll('.card[data-key]').forEach(el=>el.onclick=()=>{
    const key=el.dataset.key,sl=ITEMS[key].slot;
    equipped[sl]= equipped[sl]===key? null : key; renderBag();});
}
$('#bagBtn').onclick=openBag; $('#bagClose').onclick=closeBag; updateBagCount();

/* ===== 遷移 ===== */
$('#toCreate').onclick=()=>{$('#titleScreen').hidden=true;$('#createScreen').hidden=false;};
$('#backTitle').onclick=()=>{$('#createScreen').hidden=true;$('#titleScreen').hidden=false;};
$('#startGame').onclick=()=>{$('#createScreen').hidden=true;$('#gameScreen').hidden=false;
  $('#avatarName').textContent=avatar.name;
  sizeOverlay();if(!map)startMap(); else {hideLoading();if(map.resize)map.resize();}};
syncCC();sizeOverlay();
})();
</script>
