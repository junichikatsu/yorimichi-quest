<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>キャラクター確認 — YORIMICHI QUEST サンプル</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f7f4;
        --surface: #ffffff;
        --border: #dcdfd6;
        --text: #1f2419;
        --muted: #5f6858;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #14170f;
          --surface: #1e2318;
          --border: #333a2a;
          --text: #eef1e6;
          --muted: #a7b096;
        }
      }
      body {
        margin: 0;
        padding: 24px;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif;
      }
      h1 {
        font-size: 1.2rem;
        margin: 0 0 4px;
      }
      .lead {
        margin: 0 0 24px;
        color: var(--muted);
        font-size: 0.85rem;
        line-height: 1.7;
      }
      h2 {
        font-size: 1rem;
        margin: 32px 0 4px;
        padding-bottom: 6px;
        border-bottom: 1px solid var(--border);
      }
      .note {
        margin: 0 0 12px;
        color: var(--muted);
        font-size: 0.8rem;
      }
      .grid {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 12px;
      }
      .cell {
        margin: 0;
        padding: 10px 8px 8px;
        min-width: 108px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        text-align: center;
      }
      .cell canvas {
        display: block;
        margin: 0 auto;
      }
      figcaption {
        margin-top: 8px;
        font-size: 0.72rem;
        color: var(--muted);
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <h1>キャラクター確認</h1>
    <p class="lead">
      アプリ本体と同じ描画コードで、髪型・服・装備の全パターンを並べています。<br />
      サーバー不要です。このファイルをブラウザで直接開いてください。<br />
      描き直したら <code>pnpm build:web</code> で再生成します。
    </p>
    <div id="root"></div>
    <script src="avatar-preview.js"></script>
  </body>
</html>
