name: イマノウチ・ヨリミチ CI

# サンプル（sample/map-checkin）とは別のワークフロー。
# パスで切り分けているので、片方を触ってももう片方は動かない。
on:
  push:
    branches: [develop, main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'tools/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - 'tsconfig.base.json'
      - 'eslint.config.js'
      - '.github/workflows/imanouchi-ci.yml'
  pull_request:
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'tools/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - 'tsconfig.base.json'
      - 'eslint.config.js'
      - '.github/workflows/imanouchi-ci.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ★ pnpm のバージョンは package.json の packageManager を正とする。
      #   ここに version: を書くと「Multiple versions of pnpm specified」で失敗する。
      #   action-setup は既定でリポジトリ直下を読むため、どちらを読むかを明示する。
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test

      # ZIP ビルドの dry run。ここで壊れていればデプロイ前に気づける。
      - run: pnpm build:zip

      - name: Verify ZIP layout
        run: |
          set -euo pipefail
          ZIP=apps/function/imanouchi-function.zip

          # 1) ルート直下に index.js と package.json があるか（親フォルダで包んでいないか）
          ENTRIES=$(unzip -Z1 "$ZIP" | sort | tr '\n' ' ')
          echo "entries: $ENTRIES"
          if [ "$ENTRIES" != "index.js package.json " ]; then
            echo "::error::ZIP のルート直下が index.js / package.json だけではありません"
            exit 1
          fi

          # 2) "type": "module" が無いか（ZIP は CommonJS 必須）
          if unzip -p "$ZIP" package.json | grep -q '"type"'; then
            echo "::error::ZIP 内 package.json に type フィールドがあります"
            exit 1
          fi

          # 3) 展開して require し、handler が関数として公開されているか
          rm -rf /tmp/zipcheck && mkdir -p /tmp/zipcheck
          unzip -q "$ZIP" -d /tmp/zipcheck
          node -e "
            const m = require('/tmp/zipcheck/index.js');
            if (typeof m.handler !== 'function') { console.error('handler is not a function'); process.exit(1); }
            console.log('handler export: ok');
          "

          # 4) 250MB 以下か
          SIZE=$(stat -c%s "$ZIP")
          echo "zip size: $SIZE bytes"
          if [ "$SIZE" -gt 262144000 ]; then
            echo "::error::ZIP が 250MB を超えています"
            exit 1
          fi

      - name: Verify cache-busting query is present
        run: |
          set -euo pipefail
          # 前段が CSS/JS の Cache-Control を上書きするため ?v= が唯一の防御。外れると
          # 「デプロイしたのに画面が変わらない」に化けるので CI で固定する。
          grep -q 'app\.js?v=__ASSET_VERSION__' apps/web/public/index.html
          grep -q 'styles\.css?v=__ASSET_VERSION__' apps/web/public/index.html
          echo "asset version placeholders: ok"

      - name: Verify LIFF SDK is loaded from LINE
        run: |
          set -euo pipefail
          # LIFF SDK は npm 配布が無く CDN 読み込みが前提。消えるとログインが成立しない。
          grep -q 'static.line-scdn.net/liff/edge/2/sdk.js' apps/web/public/index.html
          echo "liff sdk tag: ok"
