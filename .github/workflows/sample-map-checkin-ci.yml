name: sample/map-checkin CI

on:
  push:
    branches: [develop, main]
    paths:
      - 'sample/map-checkin/**'
      - '.github/workflows/sample-map-checkin-ci.yml'
  pull_request:
    paths:
      - 'sample/map-checkin/**'
      - '.github/workflows/sample-map-checkin-ci.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: sample/map-checkin

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ★ リポジトリ直下にも package.json ができたため、読む対象を明示する。
      #   既定（直下）のままだと、直下の packageManager と version: が衝突して失敗する。
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: sample/map-checkin/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: sample/map-checkin/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test

      # ZIP ビルドの dry run。ここで壊れていればデプロイ前に気づける。
      - run: pnpm build:zip

      - name: Verify ZIP layout
        run: |
          set -euo pipefail
          ZIP=apps/function/map-checkin-function.zip

          # 1) ルート直下に index.js と package.json があるか（親フォルダで包んでいないか）
          ENTRIES=$(unzip -Z1 "$ZIP" | sort | tr '\n' ' ')
          echo "entries: $ENTRIES"
          if [ "$ENTRIES" != "index.js package.json " ]; then
            echo "::error::ZIP のルート直下が index.js / package.json だけではありません"
            exit 1
          fi

          # 2) "type": "module" が無いか（ZIP は CommonJS 必須）
          if unzip -p "$ZIP" package.json | grep -q '"type"'; then
            echo "::error::ZIP 内 package.json に type フィールドがあります"
            exit 1
          fi

          # 3) 展開して require し、handler が関数として公開されているか
          rm -rf /tmp/zipcheck && mkdir -p /tmp/zipcheck
          unzip -q "$ZIP" -d /tmp/zipcheck
          node -e "
            const m = require('/tmp/zipcheck/index.js');
            if (typeof m.handler !== 'function') { console.error('handler is not a function'); process.exit(1); }
            console.log('handler export: ok');
          "

          # 4) 250MB 以下か
          SIZE=$(stat -c%s "$ZIP")
          echo "zip size: $SIZE bytes"
          if [ "$SIZE" -gt 262144000 ]; then
            echo "::error::ZIP が 250MB を超えています"
            exit 1
          fi

      - name: Verify cache-busting query is present
        run: |
          set -euo pipefail
          # 前段が CSS/JS の Cache-Control を上書きするため ?v= が唯一の防御。外れると
          # 「デプロイしたのに画面が変わらない」に化けるので CI で固定する。
          grep -q 'app\.js?v=__ASSET_VERSION__' apps/web/public/index.html
          grep -q 'styles\.css?v=__ASSET_VERSION__' apps/web/public/index.html
          echo "asset version placeholders: ok"
