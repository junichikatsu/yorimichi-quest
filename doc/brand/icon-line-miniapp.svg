<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 130" width="1024" height="1024">
  <title>イマノウチ・ヨリミチ アイコン</title>
  <!--
    LINE ミニアプリのアイコン。ファビコン（apps/web/public/index.html）と同じ図案・同じ色で、
    LINE の指定に合わせて置き方だけ変えてある。

    ★ 色は提出資料から採っている。地 #1B3B2B（資料の図形色で最多）、図案 #7CB342（次に多い）。
      アプリ画面の --accent（紫）は使わない。資料に紫は一度も出てこないため。
    ★ 地は全面（角を丸めない）。LINE 側が表示のときに角丸や円で切り抜くため、
      こちらで丸めると二重に丸まって縁が汚れる。
    ★ 図案は 130 の地に対して 70x62。指定は 54〜90（推奨 54〜76）。
    ★ 輪郭は 8% の黒。LINE の指定で「地が白でも黒でもない色」のときの値である。
      幅は地の 1/130 なので、どの書き出し寸法でも表示時には髪の毛一本になる。
  -->
  <rect width="130" height="130" fill="#1B3B2B"/>
  <rect x="0.5" y="0.5" width="129" height="129" fill="none" stroke="#000000" stroke-opacity="0.08" stroke-width="1"/>
  <g transform="translate(14.668 15.442) scale(3.0973)"><path d='M8.5 25C8.5 19 17 20.5 19.5 15' fill='none' stroke='#7CB342' stroke-width='4.6' stroke-linecap='round'/><circle cx='22.5' cy='8.5' r='3.8' fill='#7CB342'/></g>
</svg>
