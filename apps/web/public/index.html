<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!--
      ★ light だけを宣言する。styles.css に暗い配色は無いので、dark を宣言すると
      端末が暗い設定のときに**スクロールバーや入力欄だけが暗くなり**、白い画面の上で浮く。
    -->
    <meta name="color-scheme" content="light" />
    <title>イマノウチ</title>
    <!--
      利用状況の計測（GA4・#82）。**ここにタグを書かない。**

      配信時に `__ANALYTICS__` を置換してタグを差し込む（apps/function/src/static.ts）。
      測定IDは環境変数 `GA_MEASUREMENT_ID` で渡すので、リポジトリにも入らず、
      デプロイなしで止められる。

      ★ 未設定なら**この行ごと消える**（1バイトも出ない）。ローカル開発は常にこの状態。
      ★ 送る内容は apps/web/src/analytics.ts にある。userId・表示名・緯度経度は送らない。
    -->
    <!--__ANALYTICS__-->
    <!--
      ?v= は前段キャッシュ対策。実行環境の前段は拡張子で Cache-Control を上書きするため、
      CSS と JS には no-cache が効かない（max-age=14400 になる）。URL を変える以外に手段がない。
      __ASSET_VERSION__ は配信時にコミットハッシュへ置換される。
    -->
    <link rel="stylesheet" href="app.css?v=__ASSET_VERSION__" />
    <!--
      LIFF SDK は LINE の CDN から読む（FR-01-1）。自前でバンドルできる形の配布が無く、
      公式もこの読み込み方を前提にしている。読めなかった場合は画面側で案内する。
    -->
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <link rel="stylesheet" href="styles.css?v=__ASSET_VERSION__" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%E2%9B%A9%3C/text%3E%3C/svg%3E"
    />
  </head>
  <body>
    <!--
      ★ 読み込み中の表示を **HTML に直接置く。**

      これが無いと、`app.js`（2.4MB）を取り終えて解釈するまで**真っ白な画面**に
      なる。React はまだ動いていないので、画面側にどれだけ読み込み表示を書いても
      ここには出ない。**起動が遅いときに一番不安になるのがこの区間である。**

      ★ `createRoot().render()` は入れ物の中身を消してから描くので、React が
      立ち上がった時点で自動的に消える。片付ける処理は要らない。

      ★ 見た目は `styles.css` の `.boot` / `.spinner` をそのまま使う。CSS は
      `<head>` で読み込むので、この時点でもう当たっている。**専用の style を
      書かない**（同じ「待ち」が違う見た目になる）。
    -->
    <div id="root">
      <div class="boot" role="status" aria-live="polite" aria-busy="true">
        <span class="spinner" aria-hidden="true"></span>
        <p>読み込んでいます…</p>
      </div>
    </div>
    <noscript>イマノウチは JavaScript を有効にしてご利用ください。</noscript>
    <script src="app.js?v=__ASSET_VERSION__"></script>
  </body>
</html>
